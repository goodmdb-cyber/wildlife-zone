<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#cfd3d6"/><stop offset=".5" stop-color="#f4f5f6"/><stop offset="1" stop-color="#b9bec2"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" x2="0">
      <stop offset="0" stop-color="#2ee85a" stop-opacity=".95"/><stop offset="1" stop-color="#2ee85a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef8f6"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="900" height="820" fill="url(#sky)"/>
  <!-- ground / orchard -->
  <rect y="700" width="900" height="120" fill="#e7efe3"/>
  <g fill="#9cc58a">
    <circle cx="90" cy="690" r="46"/><circle cx="190" cy="700" r="38"/>
    <circle cx="700" cy="692" r="44"/><circle cx="810" cy="700" r="40"/>
  </g>
  <g fill="#d64b3a"><circle cx="75" cy="690" r="6"/><circle cx="105" cy="672" r="6"/><circle cx="185" cy="695" r="6"/><circle cx="712" cy="684" r="6"/><circle cx="800" cy="702" r="6"/></g>

  <!-- pole -->
  <rect x="432" y="470" width="36" height="300" fill="url(#metal)" stroke="#9aa0a5"/>
  <!-- pan-tilt base -->
  <rect x="400" y="420" width="100" height="60" rx="10" fill="#e9eaea" stroke="#8d9296"/>
  <rect x="396" y="470" width="108" height="14" rx="4" fill="#3b3b3b"/>
  <!-- laser housing -->
  <rect x="360" y="330" width="210" height="80" rx="8" fill="#eef0f0" stroke="#8d9296" stroke-width="2"/>
  <rect x="350" y="320" width="230" height="16" rx="5" fill="#dfe2e3" stroke="#8d9296"/>
  <rect x="428" y="408" width="44" height="16" fill="#cfd3d6" stroke="#8d9296"/>
  <circle cx="366" cy="370" r="20" fill="#1d2b22" stroke="#6e7479" stroke-width="3"/>
  <circle cx="366" cy="370" r="8" fill="#39ff6a"/>
  <!-- laser beam -->
  <polygon points="360,366 40,560 40,600 360,374" fill="url(#beam)"/>
  <!-- stub to deterrent -->
  <rect x="444" y="268" width="12" height="54" fill="#2f2e2e"/>
  <!-- solar deterrent (yellow) -->
  <rect x="360" y="222" width="180" height="56" rx="28" fill="#f2b705" stroke="#b58700" stroke-width="2"/>
  <circle cx="398" cy="250" r="19" fill="#262626"/><circle cx="398" cy="250" r="9" fill="#555"/>
  <circle cx="502" cy="250" r="19" fill="#262626"/><circle cx="502" cy="250" r="9" fill="#555"/>
  <circle cx="450" cy="250" r="9" fill="#333"/>
  <rect x="380" y="208" width="140" height="14" rx="3" fill="#1f3b63" stroke="#0f223b"/>
  <!-- sound waves -->
  <g fill="none" stroke="#44dbbd" stroke-width="5" stroke-linecap="round">
    <path d="M570 220 q22 30 0 60"/><path d="M596 205 q34 45 0 90"/><path d="M622 190 q46 60 0 120"/>
    <path d="M330 220 q-22 30 0 60"/><path d="M304 205 q-34 45 0 90"/><path d="M278 190 q-46 60 0 120"/>
  </g>
  <!-- venturi horn module -->
  <rect x="444" y="176" width="12" height="34" fill="#2f2e2e"/>
  <path d="M410 176 L490 176 L476 140 C470 120 470 110 474 96 L426 96 C430 110 430 120 424 140 Z" fill="#6f7d86" stroke="#3f4a51" stroke-width="2"/>
  <path d="M396 96 C420 86 480 86 504 96 L474 96 L426 96 Z" fill="#5a6770" stroke="#3f4a51"/>
  <ellipse cx="450" cy="96" rx="54" ry="10" fill="#4b565d" stroke="#3f4a51"/>
  <rect x="436" y="150" width="28" height="22" rx="4" fill="#9ad7ff" stroke="#3f4a51"/>
  <!-- vapor -->
  <g fill="none" stroke="#8fa9b5" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M420 84 c-20 -18 10 -30 -10 -50"/><path d="M450 80 c-16 -20 14 -30 0 -56"/><path d="M480 84 c20 -18 -10 -30 10 -50"/>
    <path d="M396 92 c-40 -6 -60 -30 -90 -24"/><path d="M504 92 c40 -6 60 -30 90 -24"/>
  </g>
  <!-- wind arrows -->
  <g stroke="#b5c3ca" stroke-width="3" fill="#b5c3ca">
    <line x1="250" y1="150" x2="370" y2="150"/><polygon points="370,144 382,150 370,156"/>
    <line x1="250" y1="170" x2="350" y2="170"/><polygon points="350,164 362,170 350,176"/>
  </g>
  <text x="236" y="140" font-size="18" fill="#7b8a91" text-anchor="end">자연풍</text>

  <!-- labels -->
  <g font-size="22" fill="#2f2e2e">
    <line x1="520" y1="120" x2="640" y2="120" stroke="#2f2e2e"/>
    <circle cx="660" cy="120" r="16" fill="#44dbbd"/><text x="660" y="127" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">3</text>
    <text x="684" y="116" font-weight="700">후각 자극</text>
    <text x="684" y="142" font-size="17" fill="#605e5e">벤투리 무동력 크레졸 확산</text>

    <line x1="545" y1="262" x2="640" y2="262" stroke="#2f2e2e"/>
    <circle cx="660" cy="262" r="16" fill="#44dbbd"/><text x="660" y="269" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">2</text>
    <text x="684" y="258" font-weight="700">청각 자극</text>
    <text x="684" y="284" font-size="17" fill="#605e5e">태양광 퇴치기 음향·LED</text>

    <line x1="570" y1="370" x2="640" y2="400" stroke="#2f2e2e"/>
    <circle cx="660" cy="404" r="16" fill="#44dbbd"/><text x="660" y="411" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">1</text>
    <text x="684" y="400" font-weight="700">시각 자극</text>
    <text x="684" y="426" font-size="17" fill="#605e5e">회전식 녹색 레이저</text>
  </g>
  <text x="450" y="800" text-anchor="middle" font-size="18" fill="#605e5e">3중 자극(시각·청각·후각) 하이브리드 퇴치기 개념도</text>
</svg>
